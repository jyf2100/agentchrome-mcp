<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4a8f"/>
      <stop offset="1" stop-color="#0c1226"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- browser window, A 字母标是内容主体 -->
  <rect x="18" y="24" width="76" height="58" rx="10" fill="url(#win)"/>
  <path d="M18 34 a10 10 0 0 1 10-10 h56 a10 10 0 0 1 10 10 v5 H18 Z" fill="#c9d6e8"/>
  <circle cx="28" cy="31.5" r="2.8" fill="#ff5f57"/>
  <circle cx="37.5" cy="31.5" r="2.8" fill="#febc2e"/>
  <circle cx="47" cy="31.5" r="2.8" fill="#28c840"/>
  <text x="56" y="78" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="36" fill="#1d3f7a">A</text>

  <!-- cursor,小一号,从右下角点向窗口 -->
  <g transform="translate(82,80) scale(1.5)">
    <path d="M0 0 L0 20 L5 15 L8.5 22.5 L11.5 21 L8 13.5 L14.5 13.5 Z"
          fill="#ffffff" stroke="#0c1226" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- AI sparkles -->
  <path d="M106 44 C107.6 51.5 110.5 54.4 118 56 C110.5 57.6 107.6 60.5 106 68 C104.4 60.5 101.5 57.6 94 56 C101.5 54.4 104.4 51.5 106 44 Z" fill="#fbbf24"/>
  <path d="M26 96 C26.9 99.9 28.6 101.6 32.5 102.5 C28.6 103.4 26.9 105.1 26 109 C25.1 105.1 23.4 103.4 19.5 102.5 C23.4 101.6 25.1 99.9 26 96 Z" fill="#7ea6ff"/>
</svg>
