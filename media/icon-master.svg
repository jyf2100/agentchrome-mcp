  </defs>

  <!-- squircle background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- browser window -->
  <rect x="20" y="26" width="72" height="56" rx="10" fill="url(#win)"/>
  <path d="M20 36 a10 10 0 0 1 10-10 h52 a10 10 0 0 1 10 10 v5 H20 Z" fill="#c9d6e8"/>
  <circle cx="30" cy="33.5" r="2.8" fill="#ff5f57"/>
  <circle cx="39.5" cy="33.5" r="2.8" fill="#febc2e"/>
  <circle cx="49" cy="33.5" r="2.8" fill="#28c840"/>
  <rect x="28" y="51" width="48" height="6" rx="3" fill="#93a5c0"/>
  <rect x="28" y="63" width="32" height="6" rx="3" fill="#c2cfe2"/>

  <!-- cursor (the agent's hand), hero element -->
