    <path d="M0 0 L0 20 L5 15 L8.5 22.5 L11.5 21 L8 13.5 L14.5 13.5 Z"
          fill="#ffffff" stroke="#0c1226" stroke-width="1.8" stroke-linejoin="round"/>
