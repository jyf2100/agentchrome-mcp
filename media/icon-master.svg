  <!-- AI sparkles -->
  <path d="M100 32 C101.6 39.5 104.5 42.4 112 44 C104.5 45.6 101.6 48.5 100 56 C98.4 48.5 95.5 45.6 88 44 C95.5 42.4 98.4 39.5 100 32 Z" fill="#fbbf24"/>
